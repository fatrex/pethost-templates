services:
  checkmate:
    image: ghcr.io/bluewave-labs/checkmate:3.12.0
    restart: unless-stopped
    environment:
      DB_CONNECTION_STRING: mongodb://mongodb:27017/uptime_db
      # CORS, and the links in notifications and emails.
      CLIENT_HOST: ${URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      LOG_LEVEL: info
    stop_grace_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy

  # Monitors, their checks, incidents, status pages and the accounts.
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: [mongod, --quiet, --bind_ip_all]
    # Both folders the image declares as volumes.
    volumes:
      - mongo:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 5s
      timeout: 30s
      retries: 30

volumes:
  mongo:
  mongo-config:
