services:
  hermes:
    image: nousresearch/hermes-agent:v0.21.6
    command: ["gateway", "run"]
    restart: unless-stopped
    # The agent's browser tool runs Chromium, which needs more than Docker's 64 MB of /dev/shm.
    shm_size: 1gb
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - data:/opt/data

volumes:
  data:
