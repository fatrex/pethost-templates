services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    restart: unless-stopped
    # Karakeep's other settings (DISABLE_SIGNUPS, OPENAI_API_KEY, ...) go into .env.
    env_file: .env
    environment:
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
    volumes:
      - data:/data

  # The headless browser that fetches a bookmarked page, its text and its screenshot.
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  # Full-text search. A minor line: a newer minor needs its data migrated.
  meilisearch:
    image: getmeili/meilisearch:v1.41
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

volumes:
  data:
  meilisearch:
