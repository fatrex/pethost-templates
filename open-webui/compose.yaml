services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.12-slim
    restart: unless-stopped
    environment:
      WEBUI_URL: ${WEBUI_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
    volumes:
      - data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

volumes:
  data:
